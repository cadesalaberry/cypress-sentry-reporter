name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      # --frozen-lockfile keeps CI in lockstep with the npm publish job
      # (.github/workflows/release.yml), which also installs frozen. Without it,
      # a stale bun.lock — e.g. a Dependabot bump that updates package.json but
      # not the lockfile — slips through CI, lands on main, and only fails later
      # when the release's frozen install rejects it. See docs/decisions/0005.
      #
      # CYPRESS_INSTALL_BINARY=0 skips the ~200MB browser binary download;
      # unit tests never launch Cypress. Only the e2e job needs the binary.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Build
        run: bun run build

      - name: Test with coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        # Dependabot-triggered runs have no access to repository Actions
        # secrets, so CODECOV_TOKEN is empty and the upload falls back to a
        # tokenless attempt. Codecov rejects tokenless uploads for same-repo
        # branches ("Token required because branch is protected"), which then
        # fails the job via fail_ci_if_error. Skip the upload for Dependabot;
        # coverage is still uploaded on main pushes and regular PRs.
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cadesalaberry/cypress-sentry-reporter
          files: ./coverage/lcov.info
          # Install the uploader from PyPI to avoid the binary's GPG
          # signature self-check, which is unreliable on the runners.
          use_pypi: true
          fail_ci_if_error: true

  e2e:
    # Pinned to 22.04: Cypress 12 ships Electron 106, whose system library
    # names predate the ubuntu-24.04 t64 renames.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cypress: ['12.17.4']
    name: e2e smoke (cypress ${{ matrix.cypress }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      # Frozen install: see the note in the build-and-test job above.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Pin Cypress ${{ matrix.cypress }}
        run: bun add -d cypress@${{ matrix.cypress }}
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ matrix.cypress }}

      - name: Install Cypress binary
        run: bunx cypress install

      - name: Build
        run: bun run build

      - name: Run e2e smoke test (dry-run envelope assertion)
        run: bun run test:e2e

  quality:
    runs-on: ubuntu-latest
    name: lint & package checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      # Frozen install: see the note in the build-and-test job above.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Lint & format check (Biome)
        run: bunx biome ci .

      - name: Build
        run: bun run build

      - name: Validate package (publint)
        run: bunx publint

      - name: Validate types (are-the-types-wrong)
        run: bunx @arethetypeswrong/cli --pack . --profile esm-only
